# 【讲解】桌面网格与分类区配置（异常测试场景）。与 grid.yaml 唯一区别：6 号格挪到 x=0.26，超出机械臂垂直抓取可达范围，用来测试"目标不可达"异常。
# 【讲解】桌面网格与分类区配置。任务节点和抓取动作服务器都读这个文件：
#   - 任务节点：检测框中心 → 像素射线 → 与桌面相交 → 落在哪个网格（cells 的 xy）→ 选哪个分类区域（zones）
#   - 抓取服务器：网格编号 → 固定取物点（cells 的 xy + 桌面高 + 半个方块）；区域编号 + 槽位 → 固定放置点
# 坐标全部是世界坐标（m），机械臂底座在 (0,0,0.75) 面朝 +x；桌面高 0.75。
# 分类规则按方向：绿 → 左侧空区(+y)；红 → 前方空区(+x，移出网格区)；蓝 → 右侧空区(-y)。桌上没有盒子。
frame: world
table_height: 0.75          # 桌面 z
object_size: 0.025          # 目标方块边长（25 mm）
cell_size: [0.05, 0.06]     # 网格格子尺寸 [x 方向, y 方向]；格子尺寸 = 相邻格中心间距，6 格连成一个 3×2 的大网格
cell_tolerance: 0.03        # 检测点离网格中心不超过这个距离才算"在该网格里"（格子 5×6 cm，取 3 cm；只看到 3 个码时映射有偏差，留足余量）

# 机械臂底座位姿（与 launch 里生成机器人的位置一致）
robot_base_xyz: [0.0, 0.0, 0.75]

# 俯视相机外参（与 world 文件里 top_camera 的 pose 一致；内参从 /camera/camera_info 读取）。
# 相机装在桌面左侧上方 (0.12, 0.35, 1.30)，斜向下对准网格中心 (0.12, 0, 0.75)（离桌面 0.55 m，视线与竖直夹角 32°）。
# 为什么不放正上方：机械臂回零姿态是"大臂竖直、小臂水平向前"，正上方看时小臂正好压住中间一列（2、5 号格）；
# 从左侧斜看，小臂的影子落到右侧分类区之外（y≈-0.27），回零状态下 6 格全部可见，不需要额外的"扫描姿态"。
# rpy 由 check_layout.py 同款公式算出：光轴指向网格中心，图像"上"= 世界 +x（前方），图像"右"= 世界 -y（机器人右手边）
camera:
  xyz: [0.12, 0.35, 1.30]
  rpy: [-1.5708, 1.0041, -1.5708]
  plane_z: 0.775            # 检测框中心对应方块顶面（0.75 + 0.025）

# 取物网格：连成一片的 3 列 × 2 行大网格，格子 5 cm(x) × 6 cm(y)，编号 1-6。行 1 x=0.105，行 2 x=0.155；列 y=+0.06/0/-0.06
# （从机器人左手边到右手边）。物体放在每格中心。整体已推到竖直抓取可达范围的前沿：远行外侧格 (0.155, ±0.06) 半径 0.166 m
# 相邻格 y 间距 0.06（手指沿 y 张开，张开时指外沿距工具中心 ±0.0325，邻格方块面在 0.0475，余量 1.5 cm）
# x 间距 0.05（垂直于开合方向，手指宽 0.02）。六格均经 check_layout.py 逆解验证可垂直抓取。
cells:
  1: {x: 0.105, y:  0.06}
  2: {x: 0.105, y:  0.00}
  3: {x: 0.105, y: -0.06}
  4: {x: 0.155, y:  0.06}
  5: {x: 0.155, y:  0.00}
  6: {x: 0.260, y: -0.06}   # 异常测试：不可达

# 网格定位码（ArUco，DICT_4X4_50）：印在网格纸四角，桌面坐标已知。相机不需要固定、不需要标定：
# 每次扫描程序在画面里找到这 4 个码，就能算出"像素 → 桌面"的映射，再把检测框中心落到网格里。
# 至少要看见 3 个码。近侧两个码紧贴网格近边外侧、远侧两个紧贴远边外侧，都避开了三个分类区的落点。
markers_dict: DICT_4X4_50
markers:
  0: {x: 0.060, y:  0.075, size: 0.035}  # 近-左
  1: {x: 0.060, y: -0.075, size: 0.035}  # 近-右
  2: {x: 0.205, y:  0.075, size: 0.035}  # 远-左
  3: {x: 0.205, y: -0.075, size: 0.035}  # 远-右
sheet_x0: 0.035                          # 打印网格纸时，纸的近边放在离底座中心 3.5 cm 处（make_markers.py 用）

# 分类区域：桌面上没有任何盒子，只有网格画了黑线；三个区域就是网格外的空桌面——
#   left  = 网格左侧(+y)空区   ← 绿色      front = 网格前方(+x，移出网格区)空区 ← 红色      right = 网格右侧(-y)空区 ← 蓝色
# x,y 是区域中心；half 是区域半宽 [x 半宽, y 半宽]，物体释放后落在这个矩形内即判"分类正确"；
# slots 是同一区域内依次放置的落点偏移（间距 0.035，方块之间留 1 cm，避免叠放/顶住）；
# jaw_axis 是放置时虎口开合方向，取与槽位排列方向垂直的轴，手指不会伸到邻位方块上方。
zones:
  left:
    x: 0.095
    y: 0.14
    half: [0.07, 0.04]
    slots: [[-0.035, 0.0], [0.0, 0.0], [0.035, 0.0]]
    jaw_axis: 'y'
  front:
    x: 0.20
    y: 0.0
    half: [0.02, 0.05]
    slots: [[0.0, -0.02], [0.0, 0.02]]   # 0.20 m 已是竖直抓取可达边缘，只放得下 2 个落点（够 2 个红方块）
    jaw_axis: 'x'
  right:
    x: 0.095
    y: -0.14
    half: [0.07, 0.04]
    slots: [[-0.035, 0.0], [0.0, 0.0], [0.035, 0.0]]
    jaw_axis: 'y'
